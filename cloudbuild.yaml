steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/stock-market-tracker:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/stock-market-tracker:latest', '.']
  
  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/stock-market-tracker:$COMMIT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/stock-market-tracker:latest']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'stock-market-tracker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/stock-market-tracker:$COMMIT_SHA'
      - '--platform'
      - 'managed'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--port'
      - '8050'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

timeout: '1200s'
images:
  - 'gcr.io/$PROJECT_ID/stock-market-tracker:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/stock-market-tracker:latest'